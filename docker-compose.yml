version: "3.9"

services:
  front-end:
    build: ./front-end
    container_name: front-end_container
    restart: always

  back-end:
    build: ./back-end
    container_name: back-end_container
    restart: always
    env_file:
      - ./back-end/.env
    expose:
      - "5001"

  nginx:
    image: nginx:latest
    container_name: nginx_container
    restart: always
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - front-end
      - back-end

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; done;'"
